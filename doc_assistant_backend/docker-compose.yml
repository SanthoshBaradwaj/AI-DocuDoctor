version: "3.9"

services:
  db:
    image: ankane/pgvector:latest
    environment:
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: app
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d app"]
      interval: 5s
      timeout: 5s
      retries: 12

  redis:
    image: redis:7.2
    ports:
      - "6379:6379"

  minio:
    image: minio/minio:RELEASE.2024-11-07T00-52-20Z
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    command: server /data --console-address ":9001"
    ports:
      - "9000:9000"   # S3 API
      - "9001:9001"   # Console
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 10s
      timeout: 5s
      retries: 12

  api:
    build:
      context: .
      dockerfile: Dockerfile
    env_file:
      - .env
    environment:
      - PYTHONPATH=/app
      - APP_ENV=local
      - DATABASE_URL=postgresql+psycopg://postgres:postgres@db:5432/app
      - STORAGE_BACKEND=s3_minio
      - S3_ENDPOINT=http://minio:9000
      - S3_BUCKET=docs
      - S3_ACCESS_KEY=minioadmin
      - S3_SECRET_KEY=minioadmin
      - S3_USE_SSL=false
      - S3_REGION=us-east-1
      - MAX_UPLOAD_MB=25
      - QUEUE_BACKEND=celery
      - REDIS_URL=redis://redis:6379/0
      - AI_BACKEND=fake
      - OCR_PROVIDER=fake
      - OCR_SERVICE_URL=
      - LLM_PROVIDER=fake
      - LLM_SERVICE_URL=
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_started
      minio:
        condition: service_healthy
    ports:
      - "8000:8000"
    command: >
      sh -c "python -m app.db_init &&
             uvicorn app.main:app --host 0.0.0.0 --port 8000"

  worker:
    build:
      context: .
      dockerfile: Dockerfile
    env_file:
      - .env
    environment:
      - PYTHONPATH=/app
      - APP_ENV=local
      - DATABASE_URL=postgresql+psycopg://postgres:postgres@db:5432/app
      - STORAGE_BACKEND=s3_minio
      - S3_ENDPOINT=http://minio:9000
      - S3_BUCKET=docs
      - S3_ACCESS_KEY=minioadmin
      - S3_SECRET_KEY=minioadmin
      - S3_USE_SSL=false
      - S3_REGION=us-east-1
      - MAX_UPLOAD_MB=25
      - QUEUE_BACKEND=celery
      - REDIS_URL=redis://redis:6379/0
      - AI_BACKEND=fake
      - OCR_PROVIDER=fake
      - OCR_SERVICE_URL=
      - LLM_PROVIDER=fake
      - LLM_SERVICE_URL=
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_started
      minio:
        condition: service_healthy
    command: >
      sh -c "celery -A app.infrastructure.queue.celery_queue.celery_app worker --loglevel=INFO"

volumes:
  pgdata:
  minio_data:
